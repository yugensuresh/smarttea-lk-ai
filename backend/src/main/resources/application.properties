spring.application.name=smarttea-backend
server.port=8000

# Matches Vite dev proxy default (frontend/vite.config.js)
smarttea.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Member 01 artifacts (Keras + joblib) — run backend from backend/ directory
smarttea.ml.enabled=true
smarttea.ml.python-executable=python
smarttea.ml.inference-script=ml/smarttea_inference.py
smarttea.ml.member01-root=src/main/java/com/smarttea/lk/model/Member01
smarttea.ml.model-root=src/main/java/com/smarttea/lk/model
smarttea.ml.process-timeout-seconds=180

# Auth (in-memory users + bearer tokens; demo account for local sign-in)
smarttea.auth.seed-demo-user=true
smarttea.auth.demo-email=demo@smarttea.lk
smarttea.auth.demo-password=demo1234
smarttea.auth.demo-full-name=Demo Estate Manager
smarttea.auth.token-ttl-seconds=86400
smarttea.auth.long-token-ttl-seconds=2592000
